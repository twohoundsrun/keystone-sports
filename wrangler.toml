name = "keystone-sports"
main = "dist/server/index.mjs"
account_id = "9f99f068882ff62fff142655f4c9f0cc"
compatibility_date = "2026-09-07"
workers_dev = true

[[routes]]
pattern = "keystone.twohoundsrun.com"
custom_domain = true

[[routes]]
pattern = "keystonebeat.com"
custom_domain = true

[[routes]]
pattern = "www.keystonebeat.com"
custom_domain = true

[assets]
directory = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "keystone-sports"
database_id = "9d1f8f05-10d5-4a1c-87d5-fe038a328540"
preview_database_id = "9d1f8f05-10d5-4a1c-87d5-fe038a328540"
migrations_dir = "drizzle"

[vars]
KEYSTONE_ADMIN_EMAIL = "twohoundsrun@gmail.com"
KEYSTONE_AI_ENABLED = "true"
AI_BASE_URL = "https://api.openai.com/v1"
AI_MODEL = "gpt-5-nano"
# Beat Module — D1 public strip on /news when ON. Default OFF until Collin verifies + flips.
# Preview: set KEYSTONE_BEAT_M1 = "true" on the preview Worker / wrangler vars.
# Public path never serves beat-poc.json fixtures.
KEYSTONE_BEAT_M1 = "true"

# Secrets (set with wrangler secret put, NOT in this file):
#   AI_API_KEY  (OpenAI key from platform.openai.com) -> wrangler secret put AI_API_KEY
#   Optional overrides (already set as vars above):
#     AI_BASE_URL  https://api.openai.com/v1
#     AI_MODEL     gpt-5-nano  ($0.05 / $0.40 per 1M tokens — cheapest OpenAI chat model)
#   KEYSTONE_AUTO_RECAP_SECRET                  -> wrangler secret put KEYSTONE_AUTO_RECAP_SECRET
#   Manual trigger (header only, never ?secret=):
#     curl -H "Authorization: Bearer $SECRET" https://keystone.twohoundsrun.com/api/auto-recap
#   KEYSTONE_BEAT_INGEST_SECRET                 -> wrangler secret put KEYSTONE_BEAT_INGEST_SECRET
#   Bot pending ingest (header only, never ?secret=):
#     curl -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" \
#       -d '{"candidates":[...]}' https://keystonebeat.com/api/editor/beat/ingest
#   KEYSTONE_ADMIN_EMAIL  (set as a var, below) -> wrangler secret put KEYSTONE_ADMIN_EMAIL if moved to a secret

[triggers]
crons = ["0 7 * * *"]
